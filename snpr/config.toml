# публикуются с любой гео-привязкой, гео-гейт отсекает лишнее до LLM.
queries = [
    "LLM",
    "AI инженер",
    "ML инженер",
    "NLP",
    "Data Scientist",
    "Machine Learning",
]
# Глубина поиска: date_from=now-hours, order_by=publication_time.
# С 18.10 это CAP, а не константа: джоба бьёт каждые 5 минут и окно
# адаптивное (resolve_search_hours): now - последний успешный прогон
# (data/last_run.txt) + 6 мин страховки. 24 ч здесь — покрытие простоев:
# ноут проснулся → окно раскрылось на всю паузу.
hours = 24
# Пол окна: меньше нельзя — даже при пустых тактах всегда чуть шире
# каденции, чтобы индекс-лаг hh не проскочил вакансию между тактами.
# 18.10: каденция 1 мин → пол 0.1 ч (6 мин).
min_hours = 0.1
# Размер страницы выдачи на запрос.
per_page = 50
# Потолок ПУЛА новых вакансий на прогон (дёшево: гейты работают по полям
# выдачи, полная карточка берётся только для выживших). Не LLM-бюджет —
# скоринг ограничен max_scored_per_run ниже. Ставить выше суточного притока.
max_new_per_run = 300
# Бюджет LLM-скоринга на прогон (0 = без потолка). 17.10, решение
# пользователя: 100 — в периоды массовых публикаций 25 не покрывало приток.
# Не хватило — вакансии не теряются: попадают в очередь data/deferred.jsonl
# и разбираются в следующих прогонах (свежие приоритетнее).
max_scored_per_run = 100

[scoring]
# 17.10: параллельный скоринг волнами. У ChatOpenAI лок на весь HTTP-запрос,
# поэтому воркер = независимый клиент. deepseek-v4.1-flash отвечает ~4-10 с.
# Живой замер 17.10: 8 воркеров ловят 429 Too Many Requests от шлюза,
# 4 — стабильны (≈ 0.5-1 вызов/с, дневной приток за пару минут).
# Ошибки бюджет не съедают, 4 провала подряд = прерывание (сторы целы).
workers = 4
# 18.10, решение пользователя: порог письма (maybe) 50 → 45. Аудит 125
# скоров: ≥75 за два дня пробил один (target), 50-74 — 2.4%, а зона 45-49
# плотная (11.2%) и почти целиком AI-роли (ГигаЧат, Домклик RecSys, QSOFT
# LLM/RAG, Analytix ML, NVIDIA/MLOps) — рынок не наполнен >70% сходством,
# бьём по всему от 45. Письмо + парковка + approve (human-in-loop) —
# сам пуск по-прежнему решает человек.
maybe_min = 45
# Порог автопилота/вердикта target: только явные попадания в профиль.
target_min = 75
# 18.10, решение пользователя: автопуск в парк-режиме при скор >= 55 —
# «рынок не наполнен вакансиями выше 70%, бьём по всем от 45, а от 55 —
# без спроса». Ниже 55 (45-54) — в парковку, решение через `snpr approve`.
# Гвард письма проверяется ДО пуска: нарушение = принудительно на
# человека, автопилот не пускает. 0 = выключить автопилот (чистый парк).
auto_approve_min = 55
# Профиль кандидата для скоринга (в системный промпт LLM). ПРИМЕР —
# ЗАМЕНИТЕ под себя: грейд, стек, деньги, гео, анти-паттерны. От этого
# напрямую зависит, какие вакансии получат высокий скор. Пусто/нет
# ключа — дефолт в scoring.py (DEFAULT_SCORING_PROFILE).
profile = '''- Senior/Lead инженер по автоматизации: автотесты, CI/CD, инфраструктура качества
- Основной стек: Python; продакшн-качество, измеримость, регресс-тесты
- Грейд: senior/lead, мидловые и джуновые позиции не рассматривает
- Формат: удалёнка РФ
- Деньги: ориентир от 200К на руки (нижняя граница интереса)
- Анти-паттерны: «RnD-витрина» без источника денег в P&L, вакансии-заглушки HR под план, «исследуем» без продукта'''

[send]
# 18.10 (~02:00), решение пользователя: автопилот пускает ТОЛЬКО по
# совсем свежим — срок жизни вакансии на момент решения не более 10 минут
# («264 отклика за 18 минут» на Фьючерс Инвестмент = бот-шторм: отклик
