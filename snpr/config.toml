[letter_guard]
# Префиксы ссылок, разрешённых в письме (свои github/статьи). Схема/www
# игнорируются, сравнение по host+path без учёта регистра.
allowed_url_prefixes = [
    "github.com/example-user/",
    "habr.com/ru/articles/",
]

[nanny]
# Няня откликов. Команда `python -m snpr nanny` читает GET /negotiations
# и показывает ДВИЖЕНИЕ: ответы работодателей, просмотры резюме, изменения
# статусов. Снапшоты — data/nanny.jsonl, между прогонами показывается только
# разница. Транспорт официальный (state, viewed_by_opponent, counters уже
# в item — без чат-эндпоинтов).
# Сколько дней тишины считать «отклик повис» и выделять в отчёте.
silence_days = 3.0

[raise]
# Автоподнятие резюме — POST /resumes/{id}/publish каждый интервал в
# рабочие часы. Ранжирование hh по свежести поднятия: буст видимости
# бесплатно. Хук вшит в такт снпрера (тихий, сбой не роняет прогон),
# руки: `python -m snpr raise [--force]`. hh сам ставит лимит 4 ч,
# меньше интервала ставить смысла нет. Пусто resume_id — первое на аккаунте.
enabled = true
interval_hours = 4.0
# Окно поднятия по МСК: ночью резюме никто не листает, буст сгорает впустую.
active_from_hour = 9
active_to_hour = 19
resume_id = ""

[reply]
# Автоответы на вопросы в чатах hh после отклика: ИИ-скринеры просят
# «релокация? график? зарплату?» — отклик висит, пока не ответишь.
# Транспорт — микрофронтенд chatik (как у reply-chats базы). Руки:
# `python -m snpr reply [--dry-run] [--confirm] [--answer-humans]`.
# БЕЗОПАСНОСТЬ: кнопки анкет — отправка только при точном совпадении
# с вариантом; свободный текст — генерация строго из капсулы
# [letter].profile + LetterGuard перед отправкой (чужие ссылки/контакты/
# числа → не отправляем, чат остаётся непрочитанным); один ответ на одно
# сообщение (data/replied.jsonl — анти-дубли и анти-петля с ботом).
# Хук вшит в такт снпрера — включается здесь (рекомендуется сначала
# погонять `reply --dry-run` на своих чатах).
enabled = false
# Как часто хук заглядывает в чатики (такт снпрера — минута, чаты реже).
interval_minutes = 15.0
# Не откапывать старьё: отвечаем только на вопросы свежее N часов.
period_hours = 72.0
# Анти-спам: не больше ответов за один прогон.
max_chats_per_run = 5
# Длинные переписки (>= N сообщений) оставляем человеку.
max_history = 20
# Свободный текст ЛЮДЯМ-рекрутерам: false = только перечислить в отчёте,
# отвечает человек сам на hh. Вопросы с кнопками и сообщения ботов
# (ИИ-помощники, isBot/имя) отвечаются всегда.
answer_humans = false

[cleanup]
# Снятие неактивных откликов. РУЧНАЯ команда `python -m snpr cleanup` —
# по умолчанию dry-run (только показать), боевой запуск `--apply`.
# Автоматики в такт снпрера НЕТ. Неактивные = отказ работодателя (discard)
# ИЛИ отклик (response) без движения дольше older_than_days; созвоны/
# приглашения/офферы не трогаем.
older_than_days = 14.0

[blacklist]
# Локальный чёрный список работодателей — файлом, не через нативный
# PUT /employers/blacklisted/{id}. Гейт в пре-фильтре (правило «blacklist»,
# вакансии отклоняются до скоринга). Формат строки: числовой id, имя или
# «id имя»; # — комментарий. Нет файла = гейт пуст (no-op). Пополнять
# руками или командой `python -m snpr blacklist add <vacancy_id>`.
file = "data/blacklist.txt"
