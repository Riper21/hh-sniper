# отклики. Старше лимита или возраст неизвестен — в парковку на человека.
# Совместимость: понимает и старый ключ max_age_hours (0/нет = выкл);
# max_age_minutes приоритетнее.
# published_at из API hh приходит в московском времени (+03:00) —
# сравнение aware-vs-aware с локальными часами (Екб, +05): разность
# моментов от пояса не зависит, рассинхрона нет (хелпер
# vacancy_age_hours в approve.py, наивная строка = +03:00 сервер hh).
# Окно поиска не сужаем: seen/deferred остаются страховкой очереди.
max_age_minutes = 10

